version: '3.8'

services:
  # Development Environment
  mongo-dev:
    image: mongo:7.0
    container_name: inmob-mongo-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo-data-dev:/data/db
    networks:
      - inmob-network
    profiles:
      - dev

  # Staging Environment
  mongo-staging:
    image: mongo:7.0
    container_name: inmob-mongo-staging
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: staging123
    ports:
      - "27018:27017"
    volumes:
      - mongo-data-staging:/data/db
    networks:
      - inmob-network
    profiles:
      - staging

  # Production Environment (backup recommended)
  mongo-prod:
    image: mongo:7.0
    container_name: inmob-mongo-prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-prod123}
    ports:
      - "27019:27017"
    volumes:
      - mongo-data-prod:/data/db
      - ./backups:/data/backups
    networks:
      - inmob-network
    profiles:
      - prod

  # MinIO (Object Storage) for all environments
  minio:
    image: minio/minio:latest
    container_name: inmob-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio_storage
    networks:
      - inmob-network
    command: server /minio_storage --console-address ":9001"
    profiles:
      - dev
      - staging

  # Redis for caching
  redis:
    image: redis:7.0-alpine
    container_name: inmob-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - inmob-network
    command: redis-server --appendonly yes
    profiles:
      - dev

  # Property Service
  property-service:
    build:
      context: ./property-service
      dockerfile: Dockerfile
    container_name: property-service
    environment:
      SPRING_PROFILES_ACTIVE: ${ENVIRONMENT:-dev}
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongo-dev:27017/inmob_properties?authSource=admin
      MINIO_ENDPOINT: minio:9000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    ports:
      - "8081:8080"
    depends_on:
      - mongo-dev
      - minio
    networks:
      - inmob-network
    profiles:
      - dev

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${ENVIRONMENT:-dev}
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - service-registry
    networks:
      - inmob-network
    profiles:
      - dev

  # Service Registry
  service-registry:
    build:
      context: ./service-registry
      dockerfile: Dockerfile
    container_name: service-registry
    environment:
      SPRING_PROFILES_ACTIVE: ${ENVIRONMENT:-dev}
    ports:
      - "8761:8761"
    networks:
      - inmob-network
    profiles:
      - dev

volumes:
  mongo-data-dev:
  mongo-data-staging:
  mongo-data-prod:
  minio-data:
  redis-data:

networks:
  inmob-network:
    driver: bridge
